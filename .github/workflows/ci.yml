name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set dps-meta git config
        run: |
          git config meta.application bknr.ttl
          git config meta.role "CLOS mixin adding CREATED-AT/EXPIRES-AT and a sweep registry to any bknr.datastore persistent class"
          git config meta.type lisp-actor
          git config meta.version 1.0.0
          git config meta.branch develop
          git config meta.licence bsd-3-clause
      - uses: denzuko/dps-meta@v1
        with:
          type: lisp-actor
